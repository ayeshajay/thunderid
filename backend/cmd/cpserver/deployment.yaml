# Control Plane deployment configuration.
#
# The Control Plane is where configuration is authored, versioned, and promoted between gateways.
# It serves the management APIs and the Control Plane console, and it holds no runtime traffic: no
# OAuth2 flows, no logins, no tokens. Those are the Data Plane's (see ../dpserver/deployment.yaml).
#
# It also holds no secrets at rest. A credential captured here is forwarded to the Data Plane that
# needs it, and what stays behind is a "kv:NAME" reference. That is why there is no secret_provider
# section below: nothing on this side resolves one.
server:
  mode: "cp"
  hostname: "localhost"
  port: 8095

  # Each tenant is one organization, identified by the deployment claim in the caller's token rather
  # than by the request, so a caller cannot address a tenant it has no token for. An organization
  # provisions its own workspace, and its gateways are resources inside that workspace.
  deployment_id_source: "token"
  deployment_id_claim: "deploymentId"

  # A trusted intermediary may name the deployment a request acts for, instead of carrying it in its
  # own token. That is how one caller acts for many tenants.
  #
  # The header is read only after the token has been validated, and only when the caller also
  # presents the key below, which only the server and that caller know. A caller without the key can
  # never name a deployment: its own token decides, as before. A caller that presents a wrong key is
  # refused rather than falling back, because presenting it is a claim to act for someone else.
  #
  # Leave key empty to turn this off. Only a control plane honors it.
  deployment_id_header:
    # Off unless switched on. Turning it off changes nothing else: the deployment id still comes from
    # the token claim, and only the header stops being read.
    enabled: false
    key_header: "X-Deployment-Key"
    key: ""
    id_header: "X-Deployment-Id"

  security:
    # Permissions this plane's management APIs require, prefixed. A token from the trusted issuer
    # carries "tenant_instance:system" rather than a bare "system", because the scope names the
    # instance it grants against, so the permissions checked here have to match it.
    #
    # Every system permission takes the prefix: tenant_instance:system, tenant_instance:system:ou,
    # tenant_instance:system:user, and so on. Leaving it unset keeps the unprefixed names.
    system_permission_prefix: "tenant_instance"

    # The identity provider whose tokens are accepted for the management APIs. Set these to your own
    # before serving anything real.
    # There are no tokens to revoke here: this plane issues none, and the management tokens it accepts
    # come from the trusted issuer below. Leaving this on would run a syncer against a revoked-token
    # table this plane deliberately does not have.
    token_revocation:
      enabled: false
    trusted_issuer:
      issuer: ""
      jwks_url: ""
      audience: "thunderid-cp"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

# The channel every Data Plane dials in on. The Data Plane always dials out, so the Control Plane
# needs no route to it and holds no credential for its management API.
#
# Each Data Plane authenticates with a token this server issued and holds encrypted, so no token is
# configured here. channel.server.auth_token exists as a shared fallback for a deployment that issues
# none; leaving it unset is what you want.
channel:
  server:
    enabled: true
    path: "/cp/connect"
    read_limit_bytes: 8388608
    rpc_timeout_seconds: 120

# Promoting is the one gateway action gated on a scope. Every other action, including applying and
# reverting, is open to any member of the organization.
#
# The caller is the environment manager, not a person: it holds the organization's environment
# hierarchy and decides which moves are allowed, then asks this server to carry one out. It presents a
# token from the same issuer the console uses, carrying this organization, and this scope is what
# distinguishes it from a console user, who cannot promote directly.
#
# The name follows security.system_permission_prefix above, because a scope from the trusted issuer
# names the instance it grants against. Change it to match whatever your authorization server issues.
promotion:
  scope: "tenant_instance:system:promote"

# The Control Plane holds no runtime state: no authorization codes, no sessions, no consent, no
# revoked tokens. Those belong to a Data Plane, so neither runtime datasource is configured here and
# no client is opened for one.
database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "default-key"

# How much of the organization's history is kept, and how far back a gateway may be taken.
#
# A version is a full copy of the organization's configuration, so keeping every one grows without
# limit for no benefit. A version a gateway is still running is kept whatever this says, so going
# back never lands on a version that has been pruned away.
versions:
  keep: 3
  # Step back one version at a time rather than jumping to any version in the history: everything
  # applied in between goes with a jump, which is rarely what was meant.
  revert_to_previous_only: true
